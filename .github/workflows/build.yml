name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate app icon
        run: swift scripts/make_icon.swift CarLyrics/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CarLyrics.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/xcodebuild.log 2>&1 && rc=0 || rc=$?
          grep -E "error:|\*\* ARCHIVE" build/xcodebuild.log || true
          if [ $rc -ne 0 ]; then tail -n 80 build/xcodebuild.log; exit $rc; fi
          test -d build/CarLyrics.xcarchive/Products/Applications/CarLyrics.app

      - name: Verify widget extension is embedded
        run: |
          APP=build/CarLyrics.xcarchive/Products/Applications/CarLyrics.app
          ls -la "$APP/PlugIns" || true
          if [ ! -d "$APP/PlugIns/CarLyricsWidget.appex" ]; then
            echo "::error::CarLyricsWidget.appex missing from CarLyrics.app/PlugIns"
            exit 1
          fi
          MODES=$(plutil -extract UIBackgroundModes json -o - "$APP/Info.plist")
          echo "UIBackgroundModes: $MODES"
          for m in audio location; do
            if ! echo "$MODES" | grep -q "\"$m\""; then
              echo "::error::UIBackgroundModes is missing '$m'"
              exit 1
            fi
          done
          # App icon: actool must have compiled it into the app + Info.plist.
          if ! plutil -extract CFBundleIcons.CFBundlePrimaryIcon json -o - "$APP/Info.plist"; then
            echo "::error::CFBundleIcons missing from Info.plist (app icon not compiled)"
            exit 1
          fi
          ls "$APP" | grep -i "AppIcon" || { echo "::error::AppIcon*.png missing from the app bundle"; exit 1; }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/CarLyrics.xcarchive/Products/Applications/CarLyrics.app Payload/
          zip -qry CarLyrics.ipa Payload
          ls -la CarLyrics.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarLyrics-ipa
          path: CarLyrics.ipa

      - name: Upload app icon preview
        uses: actions/upload-artifact@v4
        with:
          name: AppIcon-png
          path: CarLyrics/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
